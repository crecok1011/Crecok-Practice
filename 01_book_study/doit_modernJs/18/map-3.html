<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카카오 지도 API - 마커 클러스터러 정의하기</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      h1 {
        font-size: 2.5rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>여러 개 마커 표시하기</h1>
    <div id="map" style="width: 100%; height: 550px"></div>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3e40b80f0d27abef8427e9ef30b18956&libraries=clusterer"></script>

    <script>
      const lat = 37.55684;
      const lng = 126.91404;

      var mapContainer = document.getElementById("map"), // 지도를 표시할 div
        mapOption = {
          center: new kakao.maps.LatLng(lat, lng), // 지도의 중심좌표
          level: 3, // 지도의 확대 레벨
        };

      var map = new kakao.maps.Map(mapContainer, mapOption); // 지도를 생성합니다

      var clusterer = new kakao.maps.MarkerClusterer({
        map: map, // 마커들을 클러스터로 관리하고 표시할 지도 객체 
        averageCenter: true, // 클러스터에 포함된 마커들의 평균 위치를 클러스터 마커 위치로 설정 
        minLevel: 10 // 클러스터 할 최소 지도 레벨 
      });

      var positions = [
        {
          title:
            '<div style="padding:5px;font-size:0.9rem">이지스퍼블리싱</div>',
          latlng: new kakao.maps.LatLng(37.55684, 126.91404),
        },
        {
          title: '<div style="padding:5px;font-size:0.9rem">테스트1</div>',
          latlng: new kakao.maps.LatLng(37.55834, 126.91302),
        },
        {
          title: '<div style="padding:5px;font-size:0.9rem">테스트2</div>',
          latlng: new kakao.maps.LatLng(37.55483, 126.91276),
        },
        {
          title: '<div style="padding:5px;font-size:0.9rem">테스트3</div>',
          latlng: new kakao.maps.LatLng(37.55744, 126.9186),
        },
      ];

      var markers = [];

      for (var i = 0; i < positions.length; i++) {
        // 마커를 생성합니다
        let marker = new kakao.maps.Marker({
          map: map, // 마커를 표시할 지도
          position: positions[i].latlng, // 마커를 표시할 위치
        });

        markers.push(marker);

        // 인포윈도우를 생성합니다
        let infowindow = new kakao.maps.InfoWindow({
          content: positions[i].title,
        });

        // 마커에 마우스오버 이벤트를 등록합니다
        kakao.maps.event.addListener(marker, "mouseover", function () {
          // 마커에 마우스오버 이벤트가 발생하면 인포윈도우를 마커위에 표시합니다
          infowindow.open(map, marker);
        });
        kakao.maps.event.addListener(marker, "mouseout", function () {
          // 마커에 마우스아웃 이벤트가 발생하면 인포윈도우를 제거합니다
          infowindow.close();
        });
      }

      clusterer.addMarkers(markers);
    </script>
  </body>
</html>
